[workspace]
members = [
    "crates/bridge-core",
    "crates/bridge-protocol",
    "crates/bridge-identity",
    "crates/bridge-discovery",
    "crates/bridge-transport",
    "crates/bridge-transfer",
    "tools/bridge-cli",
    "tests/integration",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["BridgeOS Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bridgeos/bridgeos"

[workspace.dependencies]
# Internal workspace crates
bridge-core = { path = "crates/bridge-core" }
bridge-protocol = { path = "crates/bridge-protocol" }
bridge-identity = { path = "crates/bridge-identity" }
bridge-discovery = { path = "crates/bridge-discovery" }
bridge-transport = { path = "crates/bridge-transport" }
bridge-transfer = { path = "crates/bridge-transfer" }

# Async & Networking
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
bytes = { version = "1.10", features = ["serde"] }
mdns-sd = "0.21"
socket2 = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.1", features = ["alloc"] }
rusqlite = { version = "0.31", features = ["bundled"] }

# Security & Cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
blake3 = "1.5"
hex = "0.4"

# Error handling & Logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
doc_markdown = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
too_many_lines = "allow"
